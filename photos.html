<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DJ-Thïmble photos — live shots and behind the scenes from a metal DJ in Japan.">
  <title>Photos | DJ-Thïmble</title>
  <link rel="stylesheet" href="style.css?v=13">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="f56986d2-67fe-4632-ba61-cb0809628ed9"></script>
</head>
<body>

  <!-- ======================================================
       NAVIGATION
       ====================================================== -->

  <nav class="site-nav" role="navigation" aria-label="Main navigation">
    <div class="container">
      <a href="index.html" class="nav-logo">DJ-THÏMBLE</a>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="music.html">Music</a></li>
        <li><a href="photos.html" class="active">Photos</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="booking.html">Booking</a></li>
      </ul>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- ======================================================
       PAGE HEADER
       ====================================================== -->

  <header class="page-header">
    <div class="container">
      <p class="hero-eyebrow">Live shots</p>
      <h1 class="page-header-title">Photos</h1>
      <div class="section-rule" aria-hidden="true"></div>
    </div>
  </header>

  <!-- ======================================================
       GALLERY
       ====================================================== -->

  <section class="section" aria-labelledby="gallery-heading">
    <div class="container">
      <h2 class="section-heading" id="gallery-heading">Gallery</h2>
      <div class="section-rule" aria-hidden="true"></div>

      <div class="photo-grid">
        <img src="images/BTEddie.jpg" alt="Metal Town Cafe flyer — Boys Town Cafe, October 24, 2026" class="lightbox-trigger">
        <img src="images/BTTime.jpg" alt="Metal Town Cafe time table — Boys Town Cafe, October 24, 2026" class="lightbox-trigger">
        <img src="images/AIRMotley.jpg" alt="Heavy Metal (is The LAW) Vol. 3 flyer — In The Air, November 5, 2026" class="lightbox-trigger">
        <img src="images/AIRTime.jpg" alt="Heavy Metal (is The LAW) Vol. 3 time table — In The Air, November 5, 2026" class="lightbox-trigger">
      </div>
    </div>
  </section>

  <!-- Lightbox -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button id="lightbox-close" aria-label="Close">&times;</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <!-- ======================================================
       FOOTER
       ====================================================== -->

  <footer class="site-footer">
    <div class="container">
      <div class="footer-logo">DJ-THÏMBLE</div>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="events.html">Events</a>
        <a href="music.html">Music</a>
        <a href="booking.html">Booking</a>
        <a href="about.html">About</a>
      </nav>
      <div class="footer-social"><a href="https://www.instagram.com/dj_thimble/" target="_blank" rel="noopener" aria-label="Instagram" class="footer-social-link"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>Instagram</a></div>
      <p class="footer-copy">&copy; 2026 DJ-Th&iuml;mble. All rights reserved.</p>
    </div>
  </footer>

  <script>
    var toggle = document.getElementById('nav-toggle');
    var links  = document.getElementById('nav-links');
    toggle.addEventListener('click', function () {
      var isOpen = links.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen);
    });

    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightbox-img');
    var closeBtn = document.getElementById('lightbox-close');

    document.querySelectorAll('.lightbox-trigger').forEach(function(img) {
      img.addEventListener('click', function() {
        lightboxImg.src = this.src;
        lightboxImg.alt = this.alt;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
      lightboxImg.src = '';
    }

    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function(e) {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

</body>
</html>
